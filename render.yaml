
services:
  - type: web
    name: aqaba-graduation-lineup
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: aqaba-graduation-db
          property: connectionString

databases:
  - name: aqaba-graduation-db
    plan: free
    region: frankfurt
